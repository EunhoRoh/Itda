spring:
  application:
    name: itda

  datasource:
    # 5433 — sealo(5432)와 로컬에서 동시에 띄울 수 있도록 포트 분리 (compose.yaml)
    url: jdbc:postgresql://localhost:5433/itda
    username: itda
    password: itda-local
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # TODO: 운영 전환 시 validate + Flyway 마이그레이션으로 교체
    properties:
      hibernate:
        default_batch_fetch_size: 100

logging:
  level:
    org.hibernate.SQL: debug

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
